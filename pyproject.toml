[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "occo-souvenir-pipeline"
version = "0.1.0"
description = "VLM-planned, multi-step AI souvenir pipeline for occo attraction photos (analyzer -> planner -> executor -> compositor -> verifier)."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "pillow>=10",
  "numpy>=1.26",
  "pydantic>=2.5",
  "pyyaml>=6",
  "requests>=2.31",
  "scipy>=1.11",
]

[project.optional-dependencies]
# VLM / LLM client (works with vLLM, OpenRouter, OpenAI, Gemini's OpenAI-compatible endpoint)
vlm = ["openai>=1.40"]
# Face detection / identity (InsightFace weights are NON-COMMERCIAL, see README)
face = ["insightface>=0.7.3", "onnxruntime>=1.17"]
# AWS Rekognition detector / identity, S3 uploads for the Modal backend
aws = ["boto3>=1.34"]
# Background removal
seg = ["rembg>=2.0.50", "onnxruntime>=1.17"]
# OCR for banned / required text checks
ocr = ["easyocr>=1.7"]
# Run Qwen-Image-Edit-2511 locally with diffusers (needs a big GPU)
local = ["torch>=2.3", "diffusers>=0.36", "transformers>=4.51", "accelerate>=0.30"]
# Nano Banana baseline for evaluation only
gemini = ["google-genai>=1.0"]
dev = ["pytest>=8"]
all = [
  "openai>=1.40", "insightface>=0.7.3", "onnxruntime>=1.17", "boto3>=1.34",
  "rembg>=2.0.50", "easyocr>=1.7", "google-genai>=1.0", "pytest>=8",
]

[project.scripts]
souvenir = "souvenir.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
